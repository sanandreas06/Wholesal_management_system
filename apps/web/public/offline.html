<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1B3E">
<title>You are offline · WHOLESTRA</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#fff;color:#0B1B3E;font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;text-align:center}
  img{width:72px;height:72px;border-radius:18px;box-shadow:0 10px 30px rgba(11,27,62,.18)}
  h1{font-size:1.5rem;margin:22px 0 8px}
  p{margin:0 0 22px;color:#45506A}
  button{font-weight:700;font-size:1rem;font-family:inherit;padding:13px 26px;border-radius:12px;border:0;background:#0B1B3E;color:#fff;cursor:pointer}
  button:hover{background:#13285A}
  small{display:block;margin-top:18px;color:#6B7590}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="WHOLESTRA">
  <h1>You are offline</h1>
  <p>WHOLESTRA needs the internet to show your stock, sales and money, so every branch sees the same, up-to-date numbers.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>This page reloads by itself when the connection comes back.</small>
</main>
<script>window.addEventListener("online",function(){location.reload();});</script>
</body>
</html>
