# WHOLESTRA on a single server. Nothing but the web address (ports 80 and 443) is open to the internet.
# Settings come from deploy/.env.production (copy deploy/env.production.example and fill it in).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: wholesale_management
    volumes:
      - wms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale -d wholesale_management"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      API_PORT: 4000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://wholesale:${POSTGRES_PASSWORD}@postgres:5432/wholesale_management?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env.production}
      AUDIT_SEAL_KEY: ${AUDIT_SEAL_KEY:?set AUDIT_SEAL_KEY in deploy/.env.production}
      JWT_EXPIRES_IN: 1d
      # sign-in emails, social sign-in and refer & earn (see docs/deployment/sign-in-setup.md); empty ones simply stay switched off
      WEB_URL: https://${DOMAIN}
      API_PUBLIC_URL: https://${DOMAIN}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WHOLESTRA}
      INQUIRY_TO: ${INQUIRY_TO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY:-}
      REFERRAL_MAX_USD: ${REFERRAL_MAX_USD:-30}

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: "https://${DOMAIN:?set DOMAIN in deploy/.env.production}/api"
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_CONTACT_WHATSAPP: ${NEXT_PUBLIC_CONTACT_WHATSAPP:-}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_HOURS: ${NEXT_PUBLIC_CONTACT_HOURS:-}
        NEXT_PUBLIC_CONTACT_LOCATION: ${NEXT_PUBLIC_CONTACT_LOCATION:-}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

  # A copy of the whole database every night at 02:00 (server time, UTC), kept for 14 days, in the "backups" folder next to this file.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( (86400 + 7200 - $$(date +%s) % 86400) % 86400 + 1 ))
          f=/backups/wholesale_$$(date +%Y-%m-%d_%H%M).dump
          if pg_dump -h postgres -U wholesale -d wholesale_management -Fc -f "$$f"; then echo "backup ok: $$f"; else echo "BACKUP FAILED"; rm -f "$$f"; fi
          find /backups -name 'wholesale_*.dump' -mtime +14 -delete
        done

volumes:
  wms_postgres_data:
  caddy_data:
