# Free demo hosting on Render (the API only). The website goes on Vercel and the database on Neon: see the "Free demo" guide.
# The two secrets are made by Render and never shown to anyone. DATABASE_URL is pasted into Render's dashboard by you.
services:
  - type: web
    name: wms-api
    runtime: docker
    plan: free
    # Frankfurt: the closest Render region to West Africa, and the same region as the Neon database (keep the two together)
    region: frankfurt
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_SEAL_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # ---- Batch 29: sign-in emails, social sign-in, refer & earn. See docs/deployment/sign-in-setup.md.
      # Anything marked sync: false is typed into Render's dashboard (Environment tab), never into this file.
      - key: WEB_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: MAIL_PROVIDER
        value: gmail
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: WHOLESTRA
      - key: INQUIRY_TO
        value: sanshubster@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: PLATFORM_ADMIN_KEY
        generateValue: true
      - key: REFERRAL_MAX_USD
        value: "30"
